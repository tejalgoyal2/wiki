name: check

# Runs on every push and pull request: the same checks Cloudflare runs before it publishes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Generated pages are up to date
        run: node scripts/generate.mjs --check
      - name: Links are up to date
        run: node scripts/link.mjs --check
      - name: Frontmatter, links and runnable code
        run: node scripts/check.mjs
      - name: Build
        run: npx quartz plugin install && npx quartz build
      - name: No broken links in the built site
        run: node scripts/check-built.mjs public
